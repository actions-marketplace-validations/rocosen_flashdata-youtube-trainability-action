name: YouTube License Labels - FlashData
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Save an auditable snapshot of a video’s Creative Commons license-label
          signal for manual rights review.
        id: data
        uses: rocosen/flashdata-youtube-trainability-action@v0.1.0
        with:
          api-key: ${{ secrets.FLASHDATA_API_KEY }}
          video-id: dQw4w9WgXcQ
          options-json: "{}"
      - name: Save data for the next pipeline stage
        uses: actions/upload-artifact@v4
        with:
          name: youtube-trainability
          path: ${{ steps.data.outputs.artifact-directory }}
          retention-days: 7
